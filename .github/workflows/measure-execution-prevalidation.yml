name: install-pipeline-validation — real-claude install smoke test (v0.1.11 reframed CI-scope-only)

# Install-pipeline validation workflow (v0.1.11 reframed; CCBL-Stage3-v0.1.11-AC3-LOCAL-REFRAME).
# Per Charter §Constraints: GHA scope = install/syntax verification only.
# NOT a measurement workflow — measurement runs on user's local macOS deployment host.
#
# Validates: real claude CLI installs cleanly on GHA macos-14 runners without
# interactive auth prompts; npm install hardening (B-3 pattern) blocks unsafe upgrades.
#
# Originally authored as "T-2-2 pre-validation" for v0.1.10 stub-vs-real selection;
# retained at v0.1.11 as install-regression CI gate per design.md §7 (h).
#
# Bail criterion: any step exits != 0 OR stdout contains /authenticate|login required/i
# OR npm install step exceeds 4 min.
#
# This workflow is intentionally minimal (one job, 5 steps).

on:
  workflow_dispatch:
  push:
    branches:
      - feat/v0.1.10-daemon-spec-changes

jobs:
  prevalidate-claude-install:
    runs-on: macos-14
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Attempt npm install of claude CLI
        id: install_claude
        timeout-minutes: 4
        run: |
          if ! npm install -g @anthropic-ai/claude-code; then echo "::error::install failed"; exit 1; fi

      - name: Check claude binary availability
        run: |
          which claude || echo "CLAUDE_NOT_FOUND"
          claude --version || echo "CLAUDE_VERSION_FAILED"

      - name: Smoke test claude help (non-interactive)
        run: |
          claude /help </dev/null 2>&1 | head -20 || echo "CLAUDE_HELP_FAILED"
